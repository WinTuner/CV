name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Build & Lighthouse
    # Pinned: ubuntu-latest migrates to 26 on 2026-10-19, stay on 24 until vetted.
    runs-on: ubuntu-24.04
    env:
      # Photos live on Cloudinary, not in git — CI builds need the same
      # public env or images 404 and Lighthouse measures a broken page.
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: asfwanaw
      NEXT_PUBLIC_CLOUDINARY_FOLDER: cv
      # Authenticated GitHub API (5k req/h instead of 60) so live data
      # resolves fast and stable during measurement. Set GH_TOKEN repo
      # secret to a PAT (no scopes needed for public data).
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high+)
        run: npm audit --audit-level=high || echo "::warning::npm audit found high+ vulnerabilities — check log"

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (max-warnings 0)
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI (performance, a11y, best practices, SEO)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./config/lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
          artifactName: lighthouse-reports

  e2e:
    name: E2E + axe
    # Pinned: see verify job.
    runs-on: ubuntu-24.04
    # Fail fast instead of burning 6h when the runner's apt mirror hangs.
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: asfwanaw
      NEXT_PUBLIC_CLOUDINARY_FOLDER: cv
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # --with-deps runs apt-get under the hood; the runner's Azure
        # mirror flakes occasionally, so retry instead of failing the job.
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: installing Playwright chromium..."
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 20s before retry..."
            sleep 20
          done
          echo "Playwright install failed after 3 attempts"
          exit 1

      - name: Run Playwright (smoke + axe)
        run: npx playwright test --project=chromium

      - name: Upload trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
